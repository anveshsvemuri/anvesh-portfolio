  </defs>
  <rect width="1200" height="800" rx="42" fill="url(#bg)"/>
  <text x="72" y="92" fill="#8ba6c8" font-family="Inter,Arial,sans-serif" font-size="22" letter-spacing="4">MLOPS · TELECOM CHURN</text>
  <text x="72" y="150" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700">Train. Gate. Serve. Monitor.</text>
