    <g fill="#eef7ff"><text x="165" y="333">Synthetic data</text><text x="165" y="365" fill="#8ba6c8" font-size="17">PII-free</text><text x="403" y="333">Validation</text><text x="403" y="365" fill="#8ba6c8" font-size="17">Schema + quality</text><text x="641" y="333">Model gate</text><text x="641" y="365" fill="#8ba6c8" font-size="17">ROC-AUC ≥ 0.70</text><text x="879" y="333">FastAPI</text><text x="879" y="365" fill="#8ba6c8" font-size="17">Online scoring</text></g>
  </g>
  <g stroke="url(#accent)" stroke-width="4" fill="none"><path d="M260 339h48"/><path d="M498 339h48"/><path d="M736 339h48"/><path d="M974 339h105v126"/></g>
