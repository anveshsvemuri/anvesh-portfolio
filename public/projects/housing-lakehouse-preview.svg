    <text x="175" y="421" fill="#8fa6cc" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Seeded · reproducible</text>
    <rect x="92" y="460" width="166" height="58" rx="14" fill="#132a48"/>
    <circle cx="119" cy="489" r="8" fill="#5de3cf"/>
