  <rect x="160" y="610" width="880" height="108" rx="24" fill="#112543" stroke="#5de3cf" stroke-opacity=".22"/>
  <text x="195" y="651" fill="#5de3cf" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">CONTROL PLANE</text>
  <g fill="#dce8f8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">
