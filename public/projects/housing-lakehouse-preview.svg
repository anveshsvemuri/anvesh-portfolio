    <text x="696" y="350" fill="#8fa6cc" font-family="Inter,Arial,sans-serif" font-size="14">Typed schema</text>
    <text x="696" y="378" fill="#8fa6cc" font-family="Inter,Arial,sans-serif" font-size="14">Deduplicated</text>
    <text x="696" y="406" fill="#8fa6cc" font-family="Inter,Arial,sans-serif" font-size="14">Quality filtered</text>
    <rect x="696" y="462" width="150" height="58" rx="14" fill="#182c49"/>
