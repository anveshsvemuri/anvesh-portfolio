<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Housing Data Lakehouse architecture preview</title>
  <desc id="desc">A cloud lakehouse diagram with ingestion, Bronze, Silver, Gold, quality, audit, and Terraform infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10264a"/>
      <stop offset="1" stop-color="#09162c"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1a45a"/><stop offset="1" stop-color="#b56532"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e5f2"/><stop offset="1" stop-color="#7794b5"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe174"/><stop offset="1" stop-color="#d99d28"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020817" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="800" rx="42" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="260" fill="#2adbc3" opacity=".1"/>
  <circle cx="120" cy="730" r="260" fill="#6a68ff" opacity=".12"/>
