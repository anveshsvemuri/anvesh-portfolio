name: Commerce reconciliation CI
on:
  push:
    paths:
      - 'projects/commerce-reconciliation/**'
      - '.github/workflows/commerce-reconciliation.yml'
  pull_request:
    paths:
      - 'projects/commerce-reconciliation/**'
      - '.github/workflows/commerce-reconciliation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run inventory ledger tests
        run: python -m unittest discover -s projects/commerce-reconciliation/tests -v
